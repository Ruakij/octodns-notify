[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octodns-notify"
version = "0.1.0"
description = "Runs octoDNS for a zone when a DNS NOTIFY for it arrives"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.4",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest", "ruff", "octodns"]

[project.scripts]
octodns-notify = "octodns_notify:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
include = ["octodns_notify.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
